name: Deploy

on:
  push:
    branches:
      - main

env:
  GCP_REGION: us-central1
  GATEWAY_IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/ecoscan-gateway
  CLASSIFIER_IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/ecoscan-classifier

jobs:
  deploy-frontend:
    name: Deploy Frontend to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GATEWAY_URL: ${{ secrets.VITE_GATEWAY_URL }}

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --token ${{ secrets.FIREBASE_TOKEN }} --project ${{ secrets.GCP_PROJECT_ID }}

  deploy-gateway:
    name: Deploy Gateway to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build and push Gateway image
        run: |
          docker build -t ${{ env.GATEWAY_IMAGE }}:${{ github.sha }} -t ${{ env.GATEWAY_IMAGE }}:latest ./gateway
          docker push ${{ env.GATEWAY_IMAGE }}:${{ github.sha }}
          docker push ${{ env.GATEWAY_IMAGE }}:latest

      - name: Deploy Gateway to Cloud Run
        run: |
          gcloud run deploy ecoscan-gateway \
            --image ${{ env.GATEWAY_IMAGE }}:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}" \
            --set-env-vars "FIREBASE_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}" \
            --set-env-vars "CLASSIFIER_URL=${{ secrets.CLASSIFIER_URL }}" \
            --quiet

  deploy-classifier:
    name: Deploy Classifier to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build and push Classifier image
        run: |
          docker build -t ${{ env.CLASSIFIER_IMAGE }}:${{ github.sha }} -t ${{ env.CLASSIFIER_IMAGE }}:latest ./classifier
          docker push ${{ env.CLASSIFIER_IMAGE }}:${{ github.sha }}
          docker push ${{ env.CLASSIFIER_IMAGE }}:latest

      - name: Deploy Classifier to Cloud Run
        run: |
          gcloud run deploy ecoscan-classifier \
            --image ${{ env.CLASSIFIER_IMAGE }}:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --no-allow-unauthenticated \
            --set-env-vars "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" \
            --set-env-vars "GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}" \
            --quiet
