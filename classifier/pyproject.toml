[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecoscan-classifier"
version = "1.0.0"
description = "EcoScan AI — Python FastAPI Classification Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.8.2",
    "google-generativeai>=0.7.2",
    "firebase-admin>=6.5.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "hypothesis>=6.112.0",
    "httpx>=0.27.0",
    "black>=24.8.0",
    "ruff>=0.6.2",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | dist
  | build
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
